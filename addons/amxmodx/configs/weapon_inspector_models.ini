; ------------------------------------------------------------
; Weapon Inspector - Per-Model Rules
; ------------------------------------------------------------
; Sections use the full viewmodel path.
;
; AUTO_INSPECT    = 0/1  (default: 1)
; MANUAL_INSPECT  = 0/1  (default: 1)
; IDLE_LOOP_TIME  = seconds, >= 0.0 (default: 0.0)
; IDLE_SEQ_FORCE  = -1 for automatic selection, or a sequence index
;
; Example:
;
; [ models/custom/v_ak47.mdl ]
; AUTO_INSPECT    = 0
; MANUAL_INSPECT  = 1
; IDLE_SEQ_FORCE  = -1
; IDLE_LOOP_TIME  = 0.80
